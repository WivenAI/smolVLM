# Overfit test config: erp_qcm_procedure2 (sft_qcm)
# train_samples: 100, epochs: 1002 - evaluate only qcm_procedure2
model:
  base_model: HuggingFaceTB/SmolVLM2-256M-Video-Instruct
  cache_dir: ../tmpcache
  image_size: 512
training:
  epochs: 1002
  train_samples: 100
  batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-05
  dpo_learning_rate: 1.0e-06
  full_finetune_learning_rate: 5.0e-06
  full_finetune_dpo_learning_rate: 1.0e-07
  strategies:
  - name: erp_qcm_procedure2
    enabled: true
    type: sft_qcm
    dataset: datasets/qcm/qcm_procedure2_geminicli.json
    image_dir: datasets/procedureimages
evaluation:
  benchmarks:
  - name: ocrbench
    enabled: false
    dataset: echo840/OCRBench
    split: test
    max_samples: 100
  - name: docvqa
    enabled: false
    dataset: nielsr/docvqa_1200_examples
    split: train
    max_samples: 100
  - name: chartqa
    enabled: false
    dataset: HuggingFaceM4/ChartQA
    split: test
    max_samples: 100
  erp_evaluation:
    qcm_gemini:
      enabled: false
      dataset: datasets/qcm/qcm_dataset_gemini.json
      image_dir: datasets/images
      max_samples: 100
    qcm_nova:
      enabled: false
      dataset: datasets/qcm/qcm_dataset_nova_pro.json
      image_dir: datasets/images
      max_samples: 100
    qcm_claudette:
      enabled: false
      dataset: datasets/qcm/qcm_claudette.json
      max_samples: 100
    qcm_procedure1:
      enabled: false
      dataset: datasets/qcm/qcm_procedure1_claude_code.json
      image_dir: datasets/procedureimages
      max_samples: 100
    qcm_procedure2:
      enabled: true
      dataset: datasets/qcm/qcm_procedure2_geminicli.json
      image_dir: datasets/procedureimages
      max_samples: 100
    logprob_gemini:
      enabled: false
      dataset: datasets/dpo/dpo_dataset_gemini.json
      image_dir: datasets/images
      max_samples: 100
    logprob_nova:
      enabled: false
      dataset: datasets/dpo/dpo_dataset_nova_pro.json
      image_dir: datasets/images
      max_samples: 100
    bertscore_gemini:
      enabled: false
      dataset: datasets/dpo/dpo_dataset_gemini.json
      image_dir: datasets/images
      lang: en
      max_samples: 100
    bertscore_nova:
      enabled: false
      dataset: datasets/dpo/dpo_dataset_nova_pro.json
      image_dir: datasets/images
      lang: en
      max_samples: 100
    rouge_gemini:
      enabled: false
      dataset: datasets/dpo/dpo_dataset_gemini.json
      image_dir: datasets/images
      max_samples: 100
    rouge_nova:
      enabled: false
      dataset: datasets/dpo/dpo_dataset_nova_pro.json
      image_dir: datasets/images
      max_samples: 100
paths:
  output_dir: modelweights_overfit
  cache_dir: datasets/cache_overfit
  results_dir: results_overfit
  logs_dir: logs_overfit
pipeline:
  continue_on_error: false
  use_wandb: true
  wandb_project: 23overfit_test
  debug_mode: false
  num_workers: 1
