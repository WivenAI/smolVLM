# NoHallucinations Pipeline Configuration - DEBUG MODE - FULL FINE-TUNING ONLY
# This file uses minimal samples for fast iteration during development
# Only full fine-tuning strategies are enabled (no LoRA/QLoRA)

# Model settings
model:
  base_model: "HuggingFaceTB/SmolVLM2-256M-Video-Instruct"
  cache_dir: "../tmpcache"

# Training configurations to run
training:
  epochs: 1
  train_samples: 2
  batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 0.00001
  dpo_learning_rate: 0.0000005
  full_finetune_learning_rate: 0.000005
  full_finetune_dpo_learning_rate: 0.0000001

  # Which training strategies to run (full fine-tuning only)
  strategies:
    - name: "baseline"
      enabled: true
      type: "none"

    # Full fine-tuning on QCM datasets
    - name: "full_ft_qcm_gemini"
      enabled: true
      type: "full_ft_qcm"
      dataset: "datasets/qcm/qcm_dataset_gemini.json"
      image_dir: "datasets/images"

    - name: "full_ft_qcm_nova"
      enabled: true
      type: "full_ft_qcm"
      dataset: "datasets/qcm/qcm_dataset_nova_pro.json"
      image_dir: "datasets/images"

    # Full fine-tuning on benchmark datasets
    - name: "full_ft_docvqa"
      enabled: true
      type: "full_ft_benchmark"
      benchmark: "docvqa"

    - name: "full_ft_ocrbench"
      enabled: true
      type: "full_ft_benchmark"
      benchmark: "ocrbench"

    - name: "full_ft_chartqa"
      enabled: true
      type: "full_ft_benchmark"
      benchmark: "chartqa"

    # Full fine-tuning on chosen/rejected dataset (SFT using chosen responses)
    - name: "full_ft_sft_chosen_rej_gemini"
      enabled: true
      type: "full_ft_chosen_rej_sft"
      dataset: "datasets/dpo/dpo_dataset_gemini.json"
      image_dir: "datasets/images"

    # Full fine-tuning DPO (preference optimization with all parameters)
    - name: "full_ft_dpo_gemini"
      enabled: true
      type: "full_ft_dpo"
      dataset: "datasets/dpo/dpo_dataset_gemini.json"
      image_dir: "datasets/images"

# Evaluation settings
evaluation:
  benchmarks:
    - name: "ocrbench"
      enabled: true
      dataset: "echo840/OCRBench"
      split: "test"
      max_samples: 2

    - name: "docvqa"
      enabled: true
      dataset: "nielsr/docvqa_1200_examples"
      split: "train"
      max_samples: 2

    - name: "chartqa"
      enabled: true
      dataset: "HuggingFaceM4/ChartQA"
      split: "test"
      max_samples: 2

  # ERP-specific evaluations
  erp_evaluation:
    qcm_gemini:
      enabled: true
      dataset: "datasets/qcm/qcm_dataset_gemini.json"
      image_dir: "datasets/images"
      max_samples: 2

    qcm_nova:
      enabled: false
      dataset: "datasets/qcm/qcm_dataset_nova_pro.json"
      image_dir: "datasets/images"
      max_samples: 2

    qcm_claudette:
      enabled: true
      dataset: "datasets/qcm/qcm_claudette.json"
      max_samples: 2

    qcm_procedure1:
      enabled: false
      dataset: "datasets/qcm/qcm_procedure1_claude_code.json"
      image_dir: "datasets/procedureimages"
      max_samples: 2

    qcm_procedure2:
      enabled: false
      dataset: "datasets/qcm/qcm_procedure2_geminicli.json"
      image_dir: "datasets/procedureimages"
      max_samples: 2

    logprob_gemini:
      enabled: true
      dataset: "datasets/dpo/dpo_dataset_gemini.json"
      image_dir: "datasets/images"

    logprob_nova:
      enabled: false
      dataset: "datasets/dpo/dpo_dataset_nova_pro.json"
      image_dir: "datasets/images"

    bertscore_gemini:
      enabled: true
      dataset: "datasets/dpo/dpo_dataset_gemini.json"
      image_dir: "datasets/images"
      lang: "en"

    bertscore_nova:
      enabled: false
      dataset: "datasets/dpo/dpo_dataset_nova_pro.json"
      image_dir: "datasets/images"
      lang: "en"

    rouge_gemini:
      enabled: true
      dataset: "datasets/dpo/dpo_dataset_gemini.json"
      image_dir: "datasets/images"

    rouge_nova:
      enabled: false
      dataset: "datasets/dpo/dpo_dataset_nova_pro.json"
      image_dir: "datasets/images"

# Paths
paths:
  output_dir: "modelweights_debug"
  cache_dir: "datasets/cache"
  results_dir: "results_debug"
  logs_dir: "logs"

# Pipeline options
pipeline:
  continue_on_error: true
  use_wandb: false
  wandb_project: "SixthComprehensivePipeline-Debug"
  debug_mode: false
  num_workers: 1
