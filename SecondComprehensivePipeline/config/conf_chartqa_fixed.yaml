# Minimal ChartQA Configuration with Masking Bug Fix
# Only ChartQA full fine-tuning + minimal evaluation

# Model settings
model:
  base_model: "HuggingFaceTB/SmolVLM2-256M-Video-Instruct"
  cache_dir: "../tmpcache"

# Training configurations
training:
  epochs: 3  # Use 3 epochs to see if accuracy improves instead of dropping
  train_samples: null  # Use all samples (or set to 50 for quick test)
  batch_size: 16
  gradient_accumulation_steps: 16  # Effective batch size = 16
  learning_rate: 0.00001
  full_finetune_learning_rate: 0.000005  # Lower LR for full fine-tuning

  # Only ChartQA full fine-tuning
  strategies:
    - name: "baseline"
      enabled: true
      type: "none"

    - name: "full_ft_chartqa"
      enabled: true
      type: "full_ft_benchmark"
      benchmark: "chartqa"

# Evaluation settings - MINIMAL (only ChartQA accuracy)
evaluation:
  benchmarks:
    - name: "chartqa"
      enabled: true
      dataset: "HuggingFaceM4/ChartQA"
      split: "test"
      max_samples: null  # Evaluate on full test set

    # Disable other benchmarks
    - name: "ocrbench"
      enabled: false

    - name: "docvqa"
      enabled: false

  # Disable ALL ERP evaluations to speed up training
  erp_evaluation:
    qcm_gemini:
      enabled: false

    qcm_nova:
      enabled: false

    qcm_claudette:
      enabled: false

    qcm_procedure1:
      enabled: false

    qcm_procedure2:
      enabled: false

    logprob_gemini:
      enabled: false

    logprob_nova:
      enabled: false

    bertscore_gemini:
      enabled: false

    bertscore_nova:
      enabled: false

    rouge_gemini:
      enabled: false

    rouge_nova:
      enabled: false

# Paths
paths:
  output_dir: "modelweights_chartqa_fixed"
  cache_dir: "datasets/cache"
  results_dir: "results_chartqa_fixed"
  logs_dir: "logs"

# Pipeline options
pipeline:
  continue_on_error: true
  use_wandb: true  # Enable WandB to track metrics
  wandb_project: "22ComprehensivePipeline"  # Use your existing project
  debug_mode: false
  num_workers: 1
