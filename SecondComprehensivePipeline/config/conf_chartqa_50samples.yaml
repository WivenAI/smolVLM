# ChartQA 50 Sample Test Configuration
# Train and evaluate on same 50 samples to verify learning

model:
  base_model: "HuggingFaceTB/SmolVLM2-256M-Video-Instruct"
  cache_dir: "../tmpcache"

training:
  epochs: 101
  train_samples: 2  # Only 2 samples - overfit test
  batch_size: 16
  gradient_accumulation_steps: 8  # Smaller effective batch for 50 samples
  learning_rate: 0.00001
  full_finetune_learning_rate: 0.000005

  strategies:
    - name: "baseline"
      enabled: false
      type: "none"

    - name: "full_ft_chartqa_50"
      enabled: true
      type: "full_ft_benchmark"
      benchmark: "chartqa"

evaluation:
  benchmarks:
    - name: "chartqa"
      enabled: true
      dataset: "HuggingFaceM4/ChartQA"
      split: "test"
      max_samples: 2  # Evaluate on same 2 samples

    - name: "ocrbench"
      enabled: false

    - name: "docvqa"
      enabled: false

  erp_evaluation:
    qcm_gemini:
      enabled: false
    qcm_nova:
      enabled: false
    qcm_claudette:
      enabled: false
    qcm_procedure1:
      enabled: false
    qcm_procedure2:
      enabled: false
    logprob_gemini:
      enabled: false
    logprob_nova:
      enabled: false
    bertscore_gemini:
      enabled: false
    bertscore_nova:
      enabled: false
    rouge_gemini:
      enabled: false
    rouge_nova:
      enabled: false

paths:
  output_dir: "modelweights_chartqa_50"
  cache_dir: "datasets/cache"
  results_dir: "results_chartqa_50"
  logs_dir: "logs"

pipeline:
  continue_on_error: true
  use_wandb: true
  wandb_project: "22ComprehensivePipeline"
  debug_mode: false
  num_workers: 1
