# NoHallucinations Pipeline Configuration
# This file defines all training and evaluation settings

# Model settings
model:
  base_model: "HuggingFaceTB/SmolVLM-500M-Instruct"
  cache_dir: "../tmpcache"

# Training configurations to run
training:
  epochs: 5
  train_samples: 1000
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.00001
  dpo_learning_rate: 0.0000005  # 5e-7, DPO typically needs lower LR than SFT
  full_finetune_learning_rate: 0.000005  # 5e-6, lower LR for full fine-tuning

  # Which training strategies to run
  strategies:
    - name: "baseline"
      enabled: true
      type: "none"  # No training, just evaluate base model

    - name: "sft_docvqa"
      enabled: true
      type: "sft_benchmark"
      benchmark: "docvqa"

    - name: "sft_ocrbench"
      enabled: true
      type: "sft_benchmark"
      benchmark: "ocrbench"

    - name: "sft_chartqa"
      enabled: true
      type: "sft_benchmark"
      benchmark: "chartqa"

    # DPO on benchmarks (using random wrong answers as rejected)
    - name: "dpo_docvqa"
      enabled: true  # Testing DPO benchmark
      type: "dpo_benchmark"
      benchmark: "docvqa"

    - name: "dpo_ocrbench"
      enabled: true
      type: "dpo_benchmark"
      benchmark: "ocrbench"

    - name: "dpo_chartqa"
      enabled: true
      type: "dpo_benchmark"
      benchmark: "chartqa"

    # ORPO on benchmarks - DISABLED: TRL ORPOTrainer doesn't officially support VLMs
    - name: "orpo_docvqa"
      enabled: false
      type: "orpo_benchmark"
      benchmark: "docvqa"

    - name: "orpo_ocrbench"
      enabled: false
      type: "orpo_benchmark"
      benchmark: "ocrbench"

    - name: "orpo_chartqa"
      enabled: false
      type: "orpo_benchmark"
      benchmark: "chartqa"

    - name: "erp_qcm_gemini"
      enabled: true
      type: "sft_qcm"
      dataset: "datasets/qcm/qcm_dataset_gemini.json"
      image_dir: "datasets/images"

    - name: "erp_qcm_nova"
      enabled: true
      type: "sft_qcm"
      dataset: "datasets/qcm/qcm_dataset_nova_pro.json"
      image_dir: "datasets/images"

    - name: "erp_qcm_combined"
      enabled: true
      type: "sft_qcm_combined"
      datasets:
        - "datasets/qcm/qcm_dataset_gemini.json"
        - "datasets/qcm/qcm_dataset_nova_pro.json"
      image_dir: "datasets/images"

    - name: "erp_dpo_gemini"
      enabled: true
      type: "dpo"
      dataset: "datasets/dpo/dpo_dataset_gemini.json"
      image_dir: "datasets/images"

    - name: "erp_dpo_nova"
      enabled: true
      type: "dpo"
      dataset: "datasets/dpo/dpo_dataset_nova_pro.json"
      image_dir: "datasets/images"

    - name: "erp_qcm_dpo_gemini"
      enabled: true
      type: "qcm_then_dpo"
      qcm_dataset: "datasets/qcm/qcm_dataset_gemini.json"
      dpo_dataset: "datasets/dpo/dpo_dataset_gemini.json"
      image_dir: "datasets/images"

    - name: "erp_dpo_qcm_gemini"
      enabled: true
      type: "dpo_then_qcm"
      dpo_dataset: "datasets/dpo/dpo_dataset_gemini.json"
      qcm_dataset: "datasets/qcm/qcm_dataset_gemini.json"
      image_dir: "datasets/images"

    - name: "erp_dpo_qcm_nova"
      enabled: true
      type: "dpo_then_qcm"
      dpo_dataset: "datasets/dpo/dpo_dataset_nova_pro.json"
      qcm_dataset: "datasets/qcm/qcm_dataset_nova_pro.json"
      image_dir: "datasets/images"

    # ORPO - DISABLED: TRL ORPOTrainer doesn't officially support VLMs
    - name: "erp_orpo_gemini"
      enabled: false
      type: "orpo"
      dataset: "datasets/dpo/dpo_dataset_gemini.json"
      image_dir: "datasets/images"

    - name: "erp_orpo_nova"
      enabled: false
      type: "orpo"
      dataset: "datasets/dpo/dpo_dataset_nova_pro.json"
      image_dir: "datasets/images"

    # Combined: QCM first, then ORPO - DISABLED: ORPO doesn't support VLMs
    - name: "erp_qcm_orpo_gemini"
      enabled: false
      type: "qcm_then_orpo"
      qcm_dataset: "datasets/qcm/qcm_dataset_gemini.json"
      orpo_dataset: "datasets/dpo/dpo_dataset_gemini.json"
      image_dir: "datasets/images"

    - name: "erp_qcm_orpo_nova"
      enabled: false
      type: "qcm_then_orpo"
      qcm_dataset: "datasets/qcm/qcm_dataset_nova_pro.json"
      orpo_dataset: "datasets/dpo/dpo_dataset_nova_pro.json"
      image_dir: "datasets/images"

    # Combined: ORPO first, then QCM - DISABLED: ORPO doesn't support VLMs
    - name: "erp_orpo_qcm_gemini"
      enabled: false
      type: "orpo_then_qcm"
      orpo_dataset: "datasets/dpo/dpo_dataset_gemini.json"
      qcm_dataset: "datasets/qcm/qcm_dataset_gemini.json"
      image_dir: "datasets/images"

    - name: "erp_orpo_qcm_nova"
      enabled: false
      type: "orpo_then_qcm"
      orpo_dataset: "datasets/dpo/dpo_dataset_nova_pro.json"
      qcm_dataset: "datasets/qcm/qcm_dataset_nova_pro.json"
      image_dir: "datasets/images"

    # SFT on DPO datasets (using chosen responses only - no preference learning)
    - name: "erp_sft_dpo_gemini"
      enabled: true
      type: "sft_dpo"
      dataset: "datasets/dpo/dpo_dataset_gemini.json"
      image_dir: "datasets/images"

    - name: "erp_sft_dpo_nova"
      enabled: true
      type: "sft_dpo"
      dataset: "datasets/dpo/dpo_dataset_nova_pro.json"
      image_dir: "datasets/images"

    # Combined: QCM then SFT on DPO dataset
    - name: "erp_qcm_sft_dpo_gemini"
      enabled: true
      type: "sft_qcm_dpo"
      qcm_dataset: "datasets/qcm/qcm_dataset_gemini.json"
      dpo_dataset: "datasets/dpo/dpo_dataset_gemini.json"
      image_dir: "datasets/images"

    - name: "erp_qcm_sft_dpo_nova"
      enabled: true
      type: "sft_qcm_dpo"
      qcm_dataset: "datasets/qcm/qcm_dataset_nova_pro.json"
      dpo_dataset: "datasets/dpo/dpo_dataset_nova_pro.json"
      image_dir: "datasets/images"

    # Reverse order: SFT-DPO first, then QCM (to compare training order)
    - name: "erp_sft_dpo_qcm_gemini"
      enabled: true
      type: "sft_dpo_qcm"
      dpo_dataset: "datasets/dpo/dpo_dataset_gemini.json"
      qcm_dataset: "datasets/qcm/qcm_dataset_gemini.json"
      image_dir: "datasets/images"

    - name: "erp_sft_dpo_qcm_nova"
      enabled: true
      type: "sft_dpo_qcm"
      dpo_dataset: "datasets/dpo/dpo_dataset_nova_pro.json"
      qcm_dataset: "datasets/qcm/qcm_dataset_nova_pro.json"
      image_dir: "datasets/images"

    # Combined datasets: QCM (both) then SFT-DPO (both)
    - name: "erp_qcm_sft_dpo_combined"
      enabled: true
      type: "sft_qcm_dpo_combined"
      qcm_datasets:
        - "datasets/qcm/qcm_dataset_gemini.json"
        - "datasets/qcm/qcm_dataset_nova_pro.json"
      dpo_datasets:
        - "datasets/dpo/dpo_dataset_gemini.json"
        - "datasets/dpo/dpo_dataset_nova_pro.json"
      image_dir: "datasets/images"

    # Combined datasets: SFT-DPO (both) then QCM (both)
    - name: "erp_sft_dpo_qcm_combined"
      enabled: true
      type: "sft_dpo_qcm_combined"
      dpo_datasets:
        - "datasets/dpo/dpo_dataset_gemini.json"
        - "datasets/dpo/dpo_dataset_nova_pro.json"
      qcm_datasets:
        - "datasets/qcm/qcm_dataset_gemini.json"
        - "datasets/qcm/qcm_dataset_nova_pro.json"
      image_dir: "datasets/images"

    # ============================================================
    # FULL FINE-TUNING STRATEGIES
    # ============================================================
    # Full fine-tuning trains ALL model parameters (no LoRA/QLoRA).
    # Recommended for smaller models (256M, 500M) for best results.
    # WARNING: Requires more GPU memory than LoRA:
    #   - SmolVLM-256M: ~4-6 GB VRAM
    #   - SmolVLM-500M: ~8-12 GB VRAM
    #   - SmolVLM-2B: ~24-32 GB VRAM (consider LoRA instead)
    # ============================================================

    # Full fine-tuning on QCM datasets
    - name: "full_ft_qcm_gemini"
      enabled: false  # Disabled: requires more GPU memory
      type: "full_ft_qcm"
      dataset: "datasets/qcm/qcm_dataset_gemini.json"
      image_dir: "datasets/images"

    - name: "full_ft_qcm_nova"
      enabled: false  # Disabled: requires more GPU memory
      type: "full_ft_qcm"
      dataset: "datasets/qcm/qcm_dataset_nova_pro.json"
      image_dir: "datasets/images"

    - name: "full_ft_qcm_combined"
      enabled: false  # Disabled: requires more GPU memory
      type: "full_ft_qcm_combined"
      datasets:
        - "datasets/qcm/qcm_dataset_gemini.json"
        - "datasets/qcm/qcm_dataset_nova_pro.json"
      image_dir: "datasets/images"

    # Full fine-tuning on benchmark datasets
    - name: "full_ft_docvqa"
      enabled: false  # Disabled: requires more GPU memory
      type: "full_ft_benchmark"
      benchmark: "docvqa"

    - name: "full_ft_ocrbench"
      enabled: false  # Disabled: requires more GPU memory
      type: "full_ft_benchmark"
      benchmark: "ocrbench"

    - name: "full_ft_chartqa"
      enabled: false  # Disabled: requires more GPU memory
      type: "full_ft_benchmark"
      benchmark: "chartqa"

    # Full fine-tuning on DPO dataset (SFT using chosen responses)
    - name: "full_ft_sft_dpo_gemini"
      enabled: false  # Disabled: requires more GPU memory
      type: "full_ft_dpo_sft"
      dataset: "datasets/dpo/dpo_dataset_gemini.json"
      image_dir: "datasets/images"

    - name: "full_ft_sft_dpo_nova"
      enabled: false  # Disabled: requires more GPU memory
      type: "full_ft_dpo_sft"
      dataset: "datasets/dpo/dpo_dataset_nova_pro.json"
      image_dir: "datasets/images"

    # Multi-stage: Full fine-tune QCM, then DPO
    - name: "full_ft_qcm_then_dpo_gemini"
      enabled: false  # Disabled: requires more GPU memory
      type: "full_ft_qcm_then_dpo"
      qcm_dataset: "datasets/qcm/qcm_dataset_gemini.json"
      dpo_dataset: "datasets/dpo/dpo_dataset_gemini.json"
      image_dir: "datasets/images"

# Evaluation settings
evaluation:
  benchmarks:
    - name: "ocrbench"
      enabled: true
      dataset: "echo840/OCRBench"
      split: "test"
      max_samples: 30000

    - name: "docvqa"
      enabled: true
      dataset: "nielsr/docvqa_1200_examples"  # Fixed: original dataset requires auth
      split: "train"
      max_samples: 30000

    - name: "chartqa"
      enabled: true
      dataset: "HuggingFaceM4/ChartQA"
      split: "test"
      max_samples: 30000

  # ERP-specific evaluations
  erp_evaluation:
    qcm_gemini:
      enabled: true
      dataset: "datasets/qcm/qcm_dataset_gemini.json"
      image_dir: "datasets/images"
      max_samples: 30000

    qcm_nova:
      enabled: true
      dataset: "datasets/qcm/qcm_dataset_nova_pro.json"
      image_dir: "datasets/images"
      max_samples: 30000

    qcm_claudette:
      enabled: true
      dataset: "datasets/qcm/qcm_claudette.json"
      max_samples: 30000

    dpo_logprobs:
      enabled: true
      dataset: "datasets/dpo/dpo_dataset_gemini.json"
      image_dir: "datasets/images"
      max_samples: 30000

    bertscore:
      enabled: true  # Disabled: too slow on CPU, use LogProb instead
      dataset: "datasets/dpo/dpo_dataset_gemini.json"
      image_dir: "datasets/images"
      max_samples: 30000
      lang: "en"  # Language for BERTScore

# Paths
paths:
  output_dir: "modelweights"
  cache_dir: "datasets/cache"
  results_dir: "results"
  logs_dir: "logs"

# Pipeline options
pipeline:
  continue_on_error: true
  use_wandb: true
  wandb_project: "SmallVLM-NoHallucinations"
  debug_mode: false  # If true, use only 10 samples
  num_workers: 2
