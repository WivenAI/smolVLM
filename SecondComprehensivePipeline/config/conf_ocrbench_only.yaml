model:
  base_model: HuggingFaceTB/SmolVLM2-256M-Video-Instruct
  cache_dir: ../tmpcache
  image_size: 512
training:
  epochs: 101
  train_samples: 1000
  batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-05
  full_finetune_learning_rate: 5.0e-06
  strategies:
  - name: full_ft_ocrbench
    enabled: true
    type: full_ft_benchmark
    benchmark: ocrbench
evaluation:
  benchmarks:
  - name: ocrbench
    enabled: true
    dataset: echo840/OCRBench
    split: test
    max_samples: 1000
  - name: docvqa
    enabled: false
    dataset: nielsr/docvqa_1200_examples
    split: train
    max_samples: 1000
  - name: chartqa
    enabled: false
    dataset: HuggingFaceM4/ChartQA
    split: test
    max_samples: 1000
  erp_evaluation:
    qcm_gemini:
      enabled: false
    qcm_nova:
      enabled: false
    qcm_claudette:
      enabled: false
    qcm_procedure1:
      enabled: false
    qcm_procedure2:
      enabled: false
    logprob_gemini:
      enabled: false
    logprob_nova:
      enabled: false
    bertscore_gemini:
      enabled: false
    bertscore_nova:
      enabled: false
    rouge_gemini:
      enabled: false
    rouge_nova:
      enabled: false
paths:
  output_dir: modelweights_ocrbench_only
  cache_dir: datasets/cache
  results_dir: results_ocrbench_only
  logs_dir: logs
pipeline:
  continue_on_error: true
  use_wandb: true
  wandb_project: 23ComprehensivePipeline
  debug_mode: false
  debug_size: 2
  num_workers: 1
